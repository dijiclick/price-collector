name: collect-intl

# THE COLLECTOR REPOSITORY IS PUBLIC — see collect.yml for why the trigger list
# is the security boundary. schedule / workflow_dispatch only, ever.
on:
  schedule:
    # Every 4 hours, offset from collect.yml's :07/:37 so the two never start
    # together. Prices abroad are swept for the feed; alerts ride the Turkish
    # run (below), so this cadence does not delay a notification by 4 hours.
    - cron: "52 1,5,9,13,17,21 * * *"
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated markets (blank = all)"
        required: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # One market failing (a block, a changed storefront) must not cancel the
      # other twenty mid-sweep.
      fail-fast: false
      # Each market is its own job: its own 5-minute brand timeouts, its own
      # runner IP, and a failure that names the country in the UI.
      max-parallel: 10
      matrix:
        country: [AE, SA, GB, US, CA, AU, IE, DE, FR, NL, BE, AT, ES, IT, PT, FI, CH, SE, DK, NO]
    concurrency:
      group: collect-intl-${{ matrix.country }}
      cancel-in-progress: false
    steps:
      # A job-level `if` cannot see `matrix`, so a manual run for a subset
      # skips the other markets here.
      - name: Selected?
        id: pick
        env:
          ASKED: ${{ inputs.countries }}
          CC: ${{ matrix.country }}
        run: |
          if [ -z "$ASKED" ] || echo ",${ASKED// /}," | grep -qi ",$CC,"; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pick.outputs.run == '1'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: steps.pick.outputs.run == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.pick.outputs.run == '1'
        run: npm ci --omit=dev --ignore-scripts
      # Mango's pages sit behind Vercel's bot challenge, which only a real
      # browser passes from a runner IP (curl_cffi-style TLS impersonation
      # still gets 429). packages/collector/src/browser.ts drives a Scrapling
      # session through browser_fetch.py; pinned because it is fetched fresh
      # on every run.
      - if: steps.pick.outputs.run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.pick.outputs.run == '1'
        name: Install Scrapling (Mango)
        run: |
          pip install "scrapling[fetchers]==0.4.15"
          scrapling install
      # The run logs of a PUBLIC repo are public. GitHub masks a secret's exact
      # value, but the collector derives per-country proxy URLs from it
      # (user__cr.us:pass@…) — a different string, so a stray error line with
      # one in it would print the password. Masking the username and password
      # themselves covers every string built from them, for every later step.
      - if: steps.pick.outputs.run == '1'
        name: Mask proxy credentials
        env:
          DATAIMPULSE_PROXY: ${{ secrets.DATAIMPULSE_PROXY }}
        run: >-
          node -e 'const v=process.env.DATAIMPULSE_PROXY; if(!v) process.exit(0);
          let u; try { u=new URL(v) } catch { console.log("::add-mask::"+v); process.exit(0) }
          for (const x of new Set([u.username, decodeURIComponent(u.username), u.password, decodeURIComponent(u.password)]))
          if (x && x.length>=4) console.log("::add-mask::"+x)'
      - if: steps.pick.outputs.run == '1'
        name: Collect ${{ matrix.country }}
        env:
          COUNTRIES: ${{ matrix.country }}
          # Collect and stop. Twenty jobs racing one notifier over the same
          # unsent events would send each alert several times; collect.yml's
          # notifier sends every market's events every 90 minutes.
          SWEEP_ONLY: "1"
          # adidas: Akamai refuses GitHub's runner IPs (2026-10-12); the Hetzner
          # box collects it instead (modadrop-adidas.timer).
          SKIP_BRANDS: adidas
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATAIMPULSE_PROXY: ${{ secrets.DATAIMPULSE_PROXY }}
          # Sephora CH's Salesforce shop API takes the same public client id as
          # Turkey's (2026-10-11).
          SEPHORA_CLIENT_ID: ${{ secrets.SEPHORA_CLIENT_ID }}
        run: npm run collect
