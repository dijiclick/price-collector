name: probe

# Manual only. Checks which candidate shops answer a GitHub runner with no
# proxy. No secrets are in scope.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Optional: space-separated URLs to GET instead of the built-in shop list"
        required: false
      requests:
        description: 'Optional: JSON array of {url, method, headers, body} — for POST/GraphQL/app-API checks'
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/probe-sites.mjs
        env:
          PROBE_URLS: ${{ inputs.urls }}
          PROBE_REQUESTS: ${{ inputs.requests }}
      - uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: probe-results.json
